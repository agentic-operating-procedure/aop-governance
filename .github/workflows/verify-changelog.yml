name: verify-changelog

# CR-042 tranche 2: the canonical verifier is maintained in this repository.
# Estate consumers will move to an immutable commit plus SHA-256 verification
# in a separate migration tranche after this source has merged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test canonical changelog verifier
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify CHANGELOG.md structure and README agreement
        run: python3 tools/changelog.py verify .
